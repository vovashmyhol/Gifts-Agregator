<!doctype html>
<html lang="ru" data-badge>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Glass Tab Bar</title>
<meta name="theme-color" content="#000000">
<style>
:root{--u:min(.62px,calc((100vw - 24px)/915));--blue:#3a8bf7;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:-apple-system,"SF Pro Text",Inter,system-ui,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}

/* мягкий фон, чтобы стекло было что преломлять; можно удалить .bg целиком */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 22% 30%,rgba(58,139,247,.22),transparent 38%),
    radial-gradient(circle at 80% 24%,rgba(183,148,246,.2),transparent 36%),
    radial-gradient(circle at 70% 78%,rgba(255,138,92,.18),transparent 38%),
    radial-gradient(circle at 18% 82%,rgba(48,209,88,.16),transparent 36%),
    #000}
.bg::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.35) 1.2px,transparent 1.6px);background-size:26px 26px;opacity:.12}

.stage{position:fixed;inset:0;z-index:1;display:grid;place-items:center}
.dock{display:flex;align-items:center;justify-content:center;gap:calc(24*var(--u))}
.circle{position:relative;width:calc(191*var(--u));height:calc(191*var(--u));display:grid;place-items:center;cursor:grab;color:#fff;touch-action:none;translate:var(--ox,0px) var(--oy,0px);scale:var(--cx,1) var(--cy,1)}
.circle>.ics{opacity:calc(1 - var(--sp,0))}
.ics{display:grid;place-items:center}
.ics svg{grid-area:1/1}
.circle svg{height:calc(70*var(--u));width:auto}
.sthumb{position:absolute;inset:0;overflow:hidden;opacity:var(--sp,0);pointer-events:none}
.sclone{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
#slens{background:rgba(90,90,90,.3)}
/* лупа/книга ⇄ глобус на вкладке «Настройки» */
.ics svg{transition:opacity .3s,transform .55s cubic-bezier(.2,1.3,.35,1)}
.circle .ics svg.ic-g{opacity:0;transform:rotate(-140deg) scale(.35);height:calc(56*var(--u))}
.circle.lang .ics svg.ic-s{opacity:0;transform:rotate(140deg) scale(.35)}
.circle.lang .ics svg.ic-g{opacity:1;transform:none}
.circle.spin .ics svg.ic-g{animation:gspin .85s cubic-bezier(.25,.8,.25,1)}
@keyframes gspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
/* меню языка */
.scrim{position:fixed;inset:0;z-index:9;display:none;touch-action:none}
.scrim.on{display:block}
.matte.menu{position:fixed;z-index:10;width:min(210px,calc(100vw - 32px));padding:9px 0;border-radius:32px;touch-action:pan-y;
  background:rgba(36,36,36,.48);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:inset 0 0 8px rgba(255,255,255,.05),0 16px 44px rgba(0,0,0,.55);
  opacity:0;visibility:hidden;transform:scale(.55);
  max-height:calc(100vh - 120px);overflow-y:auto;overscroll-behavior:contain;
  transition:transform .17s ease-in,opacity .14s,visibility .14s}
.matte.menu.on{opacity:1;visibility:visible;transform:none;transition:transform .34s cubic-bezier(.2,1.3,.35,1),opacity .16s,visibility 0s}
.mi{position:relative;height:44px;margin:0 8px;padding-left:53px;display:flex;align-items:center;border-radius:18px;font-size:17px;color:#fff;white-space:nowrap;transition:background .12s}
.mi.hl{background:rgba(255,255,255,.14)}
.mi .ck{position:absolute;left:21px;top:50%;width:15px;height:15px;margin-top:-7.5px;opacity:0}
.mi.sel .ck{opacity:1}

.matte{border-radius:999px;background:rgba(60,60,60,.62);-webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8);border:0;
  box-shadow:inset 0 0 8px rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.3)}
.matte::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;filter:blur(.4px);
  background:linear-gradient(90deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.12) 16%,rgba(255,255,255,.2) 36%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.2) 64%,rgba(255,255,255,.12) 84%,rgba(255,255,255,.03) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass{border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 0 16px -4px rgba(255,255,255,.45),0 10px 26px rgba(0,0,0,.4)}
.solid{background:rgba(255,255,255,.16);border-radius:999px;opacity:clamp(0,calc(1 - var(--p)*4),1);will-change:transform,opacity;backface-visibility:hidden}
.thumb{border:1px solid rgba(255,255,255,.1);box-shadow:0 calc(6px + var(--p)*10px) calc(18px + var(--p)*20px) rgba(0,0,0,calc(.3 + var(--p)*.25));opacity:clamp(0,calc(var(--p)*4),1);overflow:hidden;will-change:transform,opacity;backface-visibility:hidden}
.lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#282828;box-shadow:inset 0 0 calc(22*var(--u)) calc(3*var(--u)) rgba(0,0,0,.1)}
.lens .tabs{inset:auto;left:calc(-14*var(--u) - var(--x)*338*var(--u) - var(--tx)*var(--u) - 1px);top:calc(-14*var(--u) - 1px);width:calc(700*var(--u));height:calc(190*var(--u));
  transform-origin:calc(181*var(--u) + var(--x)*338*var(--u) + var(--tx)*var(--u)) calc(95*var(--u));scale:calc((1 + .5*(var(--sy,1) - 1))/var(--sx,1)) calc((1 + .5*(var(--sy,1) - 1))/var(--sy,1))}
.lens .gap,.lens .tab.on .gap{stroke:#282828}
.bar{position:relative;width:calc(700*var(--u));height:calc(190*var(--u));touch-action:none;cursor:grab}
.bar.down{cursor:grabbing}
.base{position:absolute;inset:0}
.fil{position:absolute;left:calc(-60*var(--u));top:calc(-40*var(--u));width:calc(963*var(--u));height:calc(270*var(--u));pointer-events:none;background:rgba(60,60,60,.62);-webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8);clip-path:path('M0 0 Z')}
.thumb,.solid{position:absolute;top:calc(14*var(--u));left:calc(14*var(--u) + var(--x)*338*var(--u));width:calc(334*var(--u));height:calc(162*var(--u));translate:calc(var(--tx)*var(--u)) 0;scale:var(--sx) var(--sy);pointer-events:none}
.tabs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,calc(338*var(--u)));padding:0 calc(12*var(--u));pointer-events:none}
.tab{all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(10*var(--u));font-size:calc(30*var(--u));font-weight:600;line-height:1.2;color:#fff;transition:color .25s;pointer-events:auto}
.bar>.tabs>.tab.on>*{opacity:clamp(0,calc(1 - var(--p)*4),1)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-4px;border-radius:999px}
.tab.on{color:var(--blue)}
.ico{position:relative;height:calc(70*var(--u));display:grid;place-items:center}
.ico svg{height:100%;width:auto;display:block}
.av{width:calc(62*var(--u));height:calc(62*var(--u));border-radius:50%;background:#7d8a97 center/cover no-repeat;display:grid;place-items:center;overflow:hidden;transition:box-shadow .25s}
.av svg{width:100%;height:100%;display:block}
.tab.on .av{box-shadow:0 0 0 calc(3*var(--u)) var(--blue)}
.bdg{display:none;position:absolute;left:calc(50*var(--u));top:calc(1*var(--u));width:calc(41*var(--u));height:calc(41*var(--u));border-radius:50%;place-items:center;font-style:normal;font-weight:700;font-size:calc(27*var(--u));line-height:1;color:#fff;background:linear-gradient(#ff5d52,#f0453b);box-shadow:0 calc(2*var(--u)) calc(6*var(--u)) rgba(0,0,0,.35)}
html[data-badge] .bdg{display:grid;animation:bdgin .45s cubic-bezier(.3,1.6,.4,1) both}
@keyframes bdgin{from{transform:scale(0)}to{transform:scale(1)}}
</style>

<script>
// Liquid Glass: SVG feDisplacementMap + backdrop-filter (техника archisvaze/liquid-glass)
const surf = x => Math.pow(1 - Math.pow(1 - x, 4), .25);
function profile(T, B, ior, N = 128) {
  const eta = 1 / ior, p = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const x = i / N, y = surf(x), dx = x < 1 ? 1e-4 : -1e-4;
    const d = (surf(x + dx) - y) / dx, m = Math.hypot(d, 1), nx = -d / m, ny = -1 / m;
    const k = 1 - eta * eta * (1 - ny * ny);
    if (k < 0) continue;
    const s = Math.sqrt(k);
    p[i] = -(eta * ny + s) * nx * ((y * B + T) / (eta - (eta * ny + s) * ny));
  }
  return p;
}
const k0 = (x, y, w) => (y * w + x) * 4 + 3;
function maps(w, h, r, B, p, mx) {
  const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); return [c, x, x.createImageData(w, h)]; };
  const [c1, x1, i1] = mk(), [c2, x2, i2] = mk(), a = i1.data, b = i2.data;
  const N = p.length, wB = w - 2 * r, hB = h - 2 * r, Bs = B * 2.5, sx = Math.cos(Math.PI / 3), sy = Math.sin(Math.PI / 3);
